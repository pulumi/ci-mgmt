# Temporary verification for the Windows Java dependency fix. Remove after verification.
name: Debug mise plugins on Windows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-dependency:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pulumi: ["3.268.0", "3.272.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare generated Java dependency
        shell: pwsh
        env:
          TEST_PULUMI_VERSION: ${{ matrix.pulumi }}
        run: |
          New-Item -ItemType Directory -Force .config | Out-Null
          Copy-Item provider-ci/test-providers/aws/.config/install-pulumi-java.sh .config/
          $fixture = Get-Content provider-ci/test-providers/aws/.config/mise.toml -Raw
          $dependency = [regex]::Match($fixture, '(?ms)^\[hooks\]\r?\n.*?(?=^\[settings\])').Value
          if (-not $dependency.Contains('[deps.pulumi-java]')) {
            throw 'Generated fixture is missing the Java dependency'
          }
          $config = @"
          [tools]
          "github:pulumi/pulumi" = "$env:TEST_PULUMI_VERSION"
          node = "24.18.0"
          [settings]
          experimental = true
          "@
          Set-Content mise.toml "$config`n$dependency"
      - name: Setup mise and run postinstall hook
        uses: jdx/mise-action@8d3b0ba20a9cea7b883d922ea958553c941ab082
        with:
          version: 2026.10.21
          add_shims_to_path: false
          cache: false
      - name: Inspect CLI and bundled language plugins
        shell: pwsh
        run: |
          Get-Command pulumi -All | Format-List Name, Source, Path, CommandType
          where.exe pulumi
          mise which pulumi
          mise ls
          $cli = (Get-Command pulumi -CommandType Application | Select-Object -First 1).Source
          Get-Item $cli | Format-List FullName, LinkType, Target, Length
          Get-ChildItem (Split-Path $cli) | Format-Table Name, LinkType, Target, Length -AutoSize
          $miseRoot = "$env:LOCALAPPDATA/mise"
          Get-ChildItem $miseRoot -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('pulumi.exe', 'pulumi-language-nodejs.exe') } |
            Format-List FullName, LinkType, Target, Length
          # Match the Go path resolution used by Pulumi's bundled-plugin lookup.
          $probe = @'
          package main
          import ("fmt"; "os"; "path/filepath")
          func main() {
            input := os.Args[1]
            resolved, err := filepath.EvalSymlinks(input)
            fmt.Printf("EvalSymlinks(%q) = %q, error = %v\n", input, resolved, err)
            for _, p := range []string{input, resolved} {
              plugin := filepath.Join(filepath.Dir(p), "pulumi-language-nodejs.exe")
              info, err := os.Stat(plugin)
              fmt.Printf("Stat(%q) = %v, error = %v\n", plugin, info, err)
            }
          }
          '@
          Set-Content "$env:RUNNER_TEMP/plugin-path-probe.go" $probe
          go run "$env:RUNNER_TEMP/plugin-path-probe.go" $cli
          & $cli version
          $plugin = Join-Path (Split-Path $cli) 'pulumi-language-nodejs.exe'
          if (Test-Path $plugin) {
            & $plugin --version
          } else {
            Write-Warning "Bundled plugin missing beside selected CLI: $plugin"
          }
      - name: Install project dependencies
        # Keep the default Windows shell. The dependency itself must invoke Bash.
        run: mise deps install
      - name: Verify selected CLI and Java plugin
        shell: pwsh
        env:
          TEST_PULUMI_VERSION: ${{ matrix.pulumi }}
        run: |
          $version = pulumi version
          if ($LASTEXITCODE -ne 0 -or $version -ne "v$env:TEST_PULUMI_VERSION") {
            throw "Unexpected Pulumi version: $version"
          }
          $plugins = pulumi plugin ls --json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list plugins' }
          $java = @($plugins | ConvertFrom-Json | Where-Object { $_.kind -eq 'language' -and $_.name -eq 'java' })
          if ($env:TEST_PULUMI_VERSION -eq '3.272.0' -and $java.Count -eq 0) {
            throw 'Java language plugin was not installed'
          }
          if ($env:TEST_PULUMI_VERSION -eq '3.268.0' -and $java.Count -ne 0) {
            throw 'Older CLI should use bundled Java, not install a language plugin'
          }
      - name: Prepare minimal Node.js program
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force nodejs-test | Out-Null
          Set-Content nodejs-test/Pulumi.yaml "name: mise-plugin-test`nruntime: nodejs"
          Set-Content nodejs-test/package.json '{"name":"mise-plugin-test","private":true,"main":"index.js"}'
          Set-Content nodejs-test/index.js 'const pulumi = require("@pulumi/pulumi"); exports.message = "plugin loaded";'
          Set-Location nodejs-test
          npm install "@pulumi/pulumi@$env:PULUMI_TEST_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
        env:
          PULUMI_TEST_VERSION: ${{ matrix.pulumi }}
      - name: Preview with explicit CLI path and ambient plugins disabled
        id: direct
        continue-on-error: true
        shell: pwsh
        env:
          PULUMI_IGNORE_AMBIENT_PLUGINS: "true"
          PULUMI_CONFIG_PASSPHRASE: test
        run: |
          $cli = (Get-Command pulumi -CommandType Application | Select-Object -First 1).Source
          Set-Location nodejs-test
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/direct-backend" | Out-Null
          & $cli login "file://$($env:RUNNER_TEMP.Replace('\', '/'))/direct-backend"
          if ($LASTEXITCODE -ne 0) { throw 'Login failed' }
          & $cli stack init direct --non-interactive
          if ($LASTEXITCODE -ne 0) { throw 'Stack init failed' }
          & $cli preview --non-interactive --logtostderr -v=9
          if ($LASTEXITCODE -ne 0) { throw 'Direct preview failed' }
      - name: Preview through release verification action
        id: action
        if: always() && steps.direct.outcome != 'skipped'
        continue-on-error: true
        uses: pulumi/verify-provider-release@52165c3d89dbd49691b82c056f377f37e6c21012
        with:
          runtime: nodejs
          directory: nodejs-test
          provider: random
          providerVersion: "4.18.5"
        env:
          ACTIONS_STEP_DEBUG: "true"
      - name: Check preview results
        if: always()
        shell: pwsh
        env:
          DIRECT_RESULT: ${{ steps.direct.outcome }}
          ACTION_RESULT: ${{ steps.action.outcome }}
        run: |
          Write-Host "Direct preview: $env:DIRECT_RESULT; verification action: $env:ACTION_RESULT"
          if ($env:DIRECT_RESULT -ne 'success' -or $env:ACTION_RESULT -ne 'success') {
            throw 'Plugin discovery failed. See diagnostics above.'
          }
