permissions: write-all # Equivalent to default permissions plus id-token: write
name: update-workflows

on:
  workflow_call:
    inputs:
      provider_name:
        required: true
        type: string
        description: "The short provider name, example aws for pulumi-aws, gcp for pulumi-gcp"
      caller_workflow:
        required: true
        type: string
        description: "The name of the caller workflow to label the generated PR with."
      called_by:
        description: "The identity of who invoked the workflow"
        required: false
        type: string
        default: "automation"
      automerge:
        description: "Mark created PRs for auto-merging?"
        required: true
        type: boolean
      downstream_test:
        description: "Whether the upgrade is a downstream test"
        type: boolean
        default: false
      skip_closing_prs:
        description: "Whether to skip closing PRs"
        type: boolean
        default: false
      tracking_branch_name:
        description: "Branch of the provider repo to update. Empty means the repo's default branch."
        required: false
        type: string
        default: ''
    outputs:
      pull_request_created:
        value: ${{ jobs.update_workflows.outputs.pull_request_created }}
        description: "Whether a PR was created"

env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-ci-mgmt

jobs:
  update_workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@32dda43ffe7a2ab21e6bce11c781b44a3e5623cf # v3
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-auth
        with:
          app-id: ${{ steps.esc-secrets.outputs.PULUMI_PROVIDER_AUTOMATION_APP_ID }}
          private-key: ${{ steps.esc-secrets.outputs.PULUMI_PROVIDER_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Clone pulumi-${{ inputs.provider_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pulumi/pulumi-${{ inputs.provider_name }}
          path: pulumi-${{ inputs.provider_name }}
          token: ${{ steps.app-auth.outputs.token }}
          # An empty ref means the repository's default branch, which is the
          # behaviour when no tracking branch is requested.
          ref: ${{ inputs.tracking_branch_name }}
      - name: Clone ci-mgmt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ci-mgmt
      - name: Initialize submodule in pulumi-${{ inputs.provider_name }}
        run: cd pulumi-${{ inputs.provider_name }} && make upstream && cd ..
        continue-on-error: true
      - name: Delete existing workflows
        run: |
          rm pulumi-${{ inputs.provider_name }}/.github/workflows/cleanup-artifacts.yml || echo "not found"
          rm pulumi-${{ inputs.provider_name }}/.github/workflows/pull_request.yml || echo "not found"
          rm pulumi-${{ inputs.provider_name }}/.github/workflows/master.yml || echo "not found"
      - name: Install mise
        uses: jdx/mise-action@8d3b0ba20a9cea7b883d922ea958553c941ab082
        with:
          version: 2026.3.7
          install_args: go golangci-lint
          cache_key_prefix: mise-v0-${{ inputs.provider_name}}-
          working_directory: pulumi-${{ inputs.provider_name }}
          github_token: ${{ steps.app-auth.outputs.token }}
      - name: Generate workflow files into pulumi-${{ inputs.provider_name }}
        working-directory: ci-mgmt/provider-ci
        run: |
          go run ./... generate \
                --config ../../pulumi-${{ inputs.provider_name }}/.ci-mgmt.yaml \
                --out ../../pulumi-${{ inputs.provider_name }}
      - name: Close obsolete PRs started by this workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: ${{ !inputs.skip_closing_prs }}
        env:
          TRACKING_BRANCH_NAME: ${{ inputs.tracking_branch_name }}
        with:
          github-token: ${{ steps.app-auth.outputs.token }}
          script: |
            const regex = /Update GitHub Actions workflows/i;
            const owner = 'pulumi';
            const repo = 'pulumi-${{ inputs.provider_name }}';
            // Only close PRs that target the same branch this run updates, so a
            // default branch run and a tracked branch run never close each
            // other's PRs.
            let base = process.env.TRACKING_BRANCH_NAME;
            if (!base) {
              const { data: repository } = await octokit.rest.repos.get({ owner, repo });
              base = repository.default_branch;
            }
            console.log('Checking ' + repo + ' for open PRs against ' + base);
            const { data: pullRequests } = await octokit.rest.pulls.list({
              owner: owner,
              repo: repo,
              state: 'open',
              base: base,
            });
            for (const pullRequest of pullRequests) {
              if (regex.test(pullRequest.title)) {
                console.log('Closing obsolete PR ' + pullRequest.number);
                await octokit.rest.pulls.update({
                  owner: owner,
                  repo: repo,
                  pull_number: pullRequest.number,
                  state: 'closed',
                });
              }
            }
      - name: Compute tracking branch PR text
        id: pr-text
        env:
          TRACKING_BRANCH_NAME: ${{ inputs.tracking_branch_name }}
        run: |
          echo "target_branch=${TRACKING_BRANCH_NAME:-master}" >> "$GITHUB_OUTPUT"
          {
            echo "tracking_branch_flag<<PR_TEXT_EOF"
            if [ -n "$TRACKING_BRANCH_NAME" ]; then
              printf ' \\\n  -f tracking_branch_name=%s\n' "$TRACKING_BRANCH_NAME"
            fi
            echo "PR_TEXT_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create PR
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          author: Pulumi Bot <bot@pulumi.com>
          body: |
            This PR was triggered by ${{ inputs.called_by }} generated by the ${{ inputs.caller_workflow }} workflow in the pulumi/ci-mgmt repo, from commit [${{ github.sha }}](https://github.com/pulumi/ci-mgmt/commit/${{ github.sha }}).
            ${{ inputs.tracking_branch_name != '' && format('It targets the `{0}` branch of pulumi-{1}, not the default branch.', inputs.tracking_branch_name, inputs.provider_name) || '' }}

            ## Rebasing this PR

            If this PR falls behind `${{ steps.pr-text.outputs.target_branch }}` on pulumi-${{ inputs.provider_name }} and needs to be regenerated against the latest tip, dispatch [`update-workflows-single-bridged-provider`](https://github.com/pulumi/ci-mgmt/actions/workflows/update-workflows-single-bridged-provider.yml):

            ```sh
            gh workflow run update-workflows-single-bridged-provider.yml \
              --repo pulumi/ci-mgmt \
              -f provider_name=${{ inputs.provider_name }} \
              -f automerge=false${{ steps.pr-text.outputs.tracking_branch_flag }}
            ```

            That re-runs this same workflow against current ci-mgmt `master`, closes this stale PR (via the "obsolete PR" cleanup step above), and opens a fresh one rebased on the provider's current `${{ steps.pr-text.outputs.target_branch }}`.
          branch: "update-github-actions-workflows-${{ github.run_number }}${{ inputs.tracking_branch_name != '' && format('-{0}', inputs.tracking_branch_name) || '' }}"
          committer: Pulumi Bot <bot@pulumi.com>
          commit-message: "[internal] Update GitHub Actions workflow files"
          labels: "impact/no-changelog-required"
          title: "${{ inputs.downstream_test == true && '[DOWNSTREAM TEST] ' || ''}}${{ inputs.tracking_branch_name != '' && format('[{0}] ', inputs.tracking_branch_name) || '' }}Update GitHub Actions workflows."
          path: pulumi-${{ inputs.provider_name }}
          token: ${{ steps.app-auth.outputs.token }}
      - name: "Set PR to auto-merge"
        if: steps.create-pr.outputs.pull-request-operation == 'created' && inputs.automerge
        # Not all providers have auto-merge enabled, and we don't want to fail providers
        # that don't have auto-merge enabled.
        #
        # After https://github.com/pulumi/home/issues/3140 is closed, we should remove
        # `continue-on-error: true`.
        continue-on-error: true
        run: "gh pr merge --auto --squash ${{ steps.create-pr.outputs.pull-request-url }}"
        env:
          GH_TOKEN: ${{ steps.app-auth.outputs.token }}
    outputs:
      pull_request_created: ${{ steps.create-pr.outputs.pull-request-operation == 'created' }}
