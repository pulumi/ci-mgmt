#{{ if .Config.AutoApproveAutomationPRs -}}#
# WARNING: This file is autogenerated - changes will be overwritten when regenerated by https://github.com/pulumi/ci-mgmt
name: Auto approve

# Approves ci-mgmt's auto-merging workflow-update PRs, which carry the automation/merge label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: github.event.pull_request.user.login == 'pulumi-provider-automation[bot]' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'automation/merge')
    steps:
    - uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
#{{ end -}}#
