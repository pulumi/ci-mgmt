# WARNING: This file is autogenerated - changes will be overwritten when regenerated by https://github.com/pulumi/ci-mgmt

name: Update skills

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read
  id-token: write # For ESC secrets.

jobs:
  update-skills:
    name: Update skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for skills lockfile
        id: skills-lock
        run: |
          if [ -f skills-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update skills
        if: steps.skills-lock.outputs.exists == 'true'
        run: npx --yes skills@1.5.16 update -y

      - id: esc-auth
        name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@159c3e431aab767d4519b96f3f784d7d3d725622
        with:
          export-environment-variables: "false"
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
      - id: esc-secrets
        name: Fetch secrets from ESC
        uses: pulumi/esc-action@eec71a90d9989af7ff14bd700b83fc72fae36119
        with:
          environment: github-secrets/${{ github.repository_owner }}-${{ github.event.repository.name }}
          export-environment-variables: "false"
          pulumi-access-token: ${{ steps.esc-auth.outputs.pulumi-access-token }}

      - name: Create pull request
        if: steps.skills-lock.outputs.exists == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            .agents/skills
            .claude/skills
            skills-lock.json
          author: Pulumi Bot <bot@pulumi.com>
          branch: update-skills
          commit-message: "[internal] Update repository skills"
          committer: Pulumi Bot <bot@pulumi.com>
          delete-branch: true
          labels: "impact/no-changelog-required"
          title: "Update repository skills"
          token: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
          body: |
            This PR updates repository skills by running:

            ```sh
            npx --yes skills@1.5.16 update -y
            ```
