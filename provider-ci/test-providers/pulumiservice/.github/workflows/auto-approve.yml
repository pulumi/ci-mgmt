name: Auto approve

# Approves the workflow-update PRs that ci-mgmt opens with auto-merge enabled,
# so they can merge on a default branch that requires an approving review.
# ci-mgmt labels a PR automation/merge only when its run asked for auto-merge,
# so test runs (automerge: false) are left for a human to review.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: github.event.pull_request.user.login == 'pulumi-provider-automation[bot]' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'automation/merge')
    steps:
    - uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
